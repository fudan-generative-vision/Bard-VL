# Stage 3: Joint Fine-tuning (understanding + generation + editing)
# Train: Vision Encoder, LLM, lm_head, image_head, vq_embed
# Freeze: Visual Tokenizer only
# Mix: 30% understanding + 40% generation + 30% editing
# Steps: ~30K

step_scheduler:
  global_batch_size: 2048  # per_device=8 × grad_accum=16 × 16GPUs
  local_batch_size: 8
  ckpt_every_steps: 2000
  num_epochs: 1

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.components.models.bard_uni.BardUniForConditionalGeneration.from_pretrained
  pretrained_model_name_or_path: exps/bard_uni_stage2c_gen_1024/latest
  attn_implementation: sdpa
  torch_dtype: "torch.bfloat16"
  vq_tokenizer_type: ibq
  vq_model_path: pretrained_models/BAAI/Emu3.5-VisionTokenizer
  vq_codebook_size: 131072
  vq_weight_tying: false

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: pretrained_models/Bard-VL-B32-Mask-4B-Instruct
  min_pixels: 65536
  max_pixels: 4194304

checkpoint:
  enabled: true
  checkpoint_dir: exps/bard_uni_stage3_joint
  model_save_format: torch_save

distributed:
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.weighted_ce.WeightedCrossEntropy

# Task mixing ratios (triggers MultiTaskDataLoader)
task_weights:
  understanding: 0.3
  generation: 0.4
  editing: 0.3

# ─── Understanding task ───
dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.bard_vl_dataset
  path_or_dataset: datasets/mixed-8192-b32-tiny
  max_len: 8192
  drop_last: true
  root_dir: datasets
  prior_dist: 'Mask'

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.bard_vl_block_collate_fn
    noise_scheduler:
      _target_: nemo_automodel.utils.scheduler.CondOTScheduler
    model_type: qwen3-vl
    mask_token_id: 151671
    vocab_size: 151646
    pad_token: <|im_end|>
    im_end_token: <|im_end|>
    block_size: 32

# ─── Generation task ───
generation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.bard_uni_dataset
  path_or_dataset: datasets/t2i_stage3_1024
  task_type: text_to_image
  max_len: 8192
  drop_last: true

generation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.bard_uni_collate_fn
    mask_token_id: 151671
    block_size: 32
    pad_token: <|im_end|>
    min_mask_rate: 0.0
    max_mask_rate: 1.0
    cfg_uncond_drop_rate: 0.1
    use_newline: false
    mask_newline: false

# ─── Editing task ───
editing_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.bard_uni_dataset
  path_or_dataset: datasets/editing_1024
  task_type: image_editing
  max_len: 8192
  drop_last: true

editing_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.bard_uni_collate_fn
    mask_token_id: 151671
    block_size: 32
    pad_token: <|im_end|>
    min_mask_rate: 0.0
    max_mask_rate: 1.0
    cfg_uncond_drop_rate: 0.1
    use_newline: false
    mask_newline: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 6e-6
  visual_lr: 6e-7
  weight_decay: 0.0
  betas: [0.9, 0.95]

lr_scheduler:
  lr_decay_style: 'cosine'
  warmup_steps: 1000
  min_lr_ratio: 0.1

freeze_config:
  freeze_embeddings: false
  freeze_vision_tower: false
  freeze_language_model: false

clip_grad_norm:
  max_norm: 1.0
